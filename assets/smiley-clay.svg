<svg class="smiley-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clay smiley">
  <defs>
    <!-- face clay: lit from the top-left, deepening toward the lower-right -->
    <radialGradient id="smFace" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffe7a1"/><stop offset=".38" stop-color="#f8cd57"/>
      <stop offset=".78" stop-color="#ebb23a"/><stop offset="1" stop-color="#d8962a"/>
    </radialGradient>
    <!-- bevel: the rounded edge rolls away into shade -->
    <radialGradient id="smBevel" cx="50%" cy="50%" r="50%">
      <stop offset=".8" stop-color="#b8720f" stop-opacity="0"/><stop offset=".93" stop-color="#b8720f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8f5506" stop-opacity=".5"/>
    </radialGradient>
    <!-- light bouncing back up onto the lower-right rim -->
    <radialGradient id="smBounce" cx="72%" cy="80%" r="34%">
      <stop offset="0" stop-color="#ffd977" stop-opacity=".45"/><stop offset="1" stop-color="#ffd977" stop-opacity="0"/>
    </radialGradient>
    <!-- navy clay for the features -->
    <radialGradient id="smInk" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#4a5888"/><stop offset=".45" stop-color="#26325c"/><stop offset="1" stop-color="#141b38"/>
    </radialGradient>
    <linearGradient id="smInkLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4778"/><stop offset=".55" stop-color="#222c55"/><stop offset="1" stop-color="#141b38"/>
    </linearGradient>
    <!-- soft self-shadow under raised features + gentle occlusion where they meet the face -->
    <filter id="smRaise" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="b"/>
      <feOffset in="b" dx="2" dy="4" result="o"/>
      <feFlood flood-color="#7a4c00" flood-opacity=".42"/><feComposite in2="o" operator="in" result="cast"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.6" result="db"/>
      <feFlood flood-color="#9a6200" flood-opacity=".3"/><feComposite in2="db" operator="in" result="ao"/>
      <feMerge><feMergeNode in="ao"/><feMergeNode in="cast"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="smSoftSm" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <g id="sm-face">
    <circle cx="100" cy="100" r="92" fill="url(#smFace)"/>
    <circle cx="100" cy="100" r="92" fill="url(#smBevel)"/>
    <circle cx="100" cy="100" r="92" fill="url(#smBounce)"/>
    <ellipse cx="70" cy="58" rx="40" ry="24" fill="#fff6d6" opacity=".5" filter="url(#smSoft)" transform="rotate(-28 70 58)"/>
    <ellipse cx="62" cy="50" rx="12" ry="6" fill="#ffffff" opacity=".45" filter="url(#smSoftSm)" transform="rotate(-32 62 50)"/>
  </g>

  <g id="sm-eyes" filter="url(#smRaise)">
    <ellipse cx="73" cy="80" rx="10.5" ry="17" fill="url(#smInk)"/>
    <ellipse cx="127" cy="80" rx="10.5" ry="17" fill="url(#smInk)"/>
  </g>
  <g id="sm-eye-shine" fill="#ffffff" opacity=".35">
    <ellipse cx="69.5" cy="72" rx="3.2" ry="5.5" filter="url(#smSoftSm)"/>
    <ellipse cx="123.5" cy="72" rx="3.2" ry="5.5" filter="url(#smSoftSm)"/>
  </g>

  <g id="sm-mouth" filter="url(#smRaise)">
    <path d="M50 114 Q100 170 150 114" fill="none" stroke="url(#smInkLine)" stroke-width="13" stroke-linecap="round"/>
  </g>
  <path id="sm-mouth-shine" d="M54 113 Q100 162 146 113" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="3" stroke-linecap="round" filter="url(#smSoftSm)"/>
</svg>